<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Consult | TeleMed Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .video-layout-grid {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 1rem;
            height: calc(100vh - 120px);
        }

        .video-main-column {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            height: 100%;
        }

        .main-feed-container {
            flex: 1;
            /* Added flex:1 to fill remaining height */
            position: relative;
            background: black;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        .remote-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        /* Branding Overlay for "Virtual Background" simulation */
        .brand-watermark {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        /* Self View / Preview Container */
        .self-preview {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .preview-window {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            /* Default Background */
            background-color: #1e293b;
            transition: background 0.3s ease;
            display: flex;
            align-items: flex-end;
            /* Show "person" at bottom */
            justify-content: center;
        }

        /* Background Classes */
        .bg-branded {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }

        /* Renamed as requested */
        .bg-dark {
            background-color: #1e40af;
        }

        /* Blue/Dark */
        .bg-light {
            background-color: #d6d3d1;
        }
        
        .bg-preview-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        /* Grey/Light */

        /* Simulated Person Outline */
        .person-silhouette {
            width: 120px;
            height: 100px;
            background: #94a3b8;
            border-radius: 60px 60px 0 0;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }

        .person-head {
            width: 60px;
            height: 70px;
            background: #94a3b8;
            border-radius: 50%;
            position: absolute;
            top: -60px;
            left: 30px;
        }

        .bg-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .bg-option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .bg-option-btn:hover,
        .bg-option-btn.active {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--primary);
            color: white;
        }

        .preview-watermark {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
            /* Only visible on branded */
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bg-branded .preview-watermark {
            opacity: 1;
        }

        .control-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }
    </style>
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo mb-1">
                <i class="fa-solid fa-heart-pulse icon-secondary"></i>
                TeleMed
            </a>

            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="scheduling.html"><i class="fa-regular fa-calendar-check"></i> Appointments</a></li>
                <li><a href="video-call.html" class="active"><i class="fa-solid fa-video"></i> Video Consult</a></li>
                <li><a href="medical-forms.html"><i class="fa-solid fa-file-medical"></i> Patient Records</a></li>
                <li><a href="tools.html"><i class="fa-solid fa-toolbox"></i> Tools</a></li>
                <li><a href="knowledge.html"><i class="fa-solid fa-book-medical"></i> Knowledge</a></li>
                <li><a href="ai-assistant.html"><i class="fa-solid fa-robot"></i> AI Assistant</a></li>
                <li class="mt-auto"><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i>
                        Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <!-- Removed Header from here to avoid overlap -->

            <div class="video-layout-grid">

                <!-- 1. Main Patient Feed (Center) with Header -->
                <div class="video-main-column">
                    <div>
                        <h2 class="page-header-title">Consultation Room #42</h2>
                        <span class="text-xs text-success"><i class="fa-solid fa-circle text-[8px] mr-1"></i>Secure E2E
                            Encrypted</span>
                    </div>

                    <div class="main-feed-container">
                        <div class="remote-feed">
                            <i class="fa-solid fa-user icon-5xl mb-4"></i>
                            <h3 class="text-xl">Patient: Michael Chen</h3>
                            <p class="text-sm">Connecting...</p>
                        </div>
                    </div>
                </div>

                <!-- 2. Controls &amp; Self Preview (Right) -->
                <div class="self-preview">
                    <h3 class="text-sm font-semibold mb-2">My Privacy View</h3>

                    <!-- Self View with Branding Simulation -->
                    <div id="selfView" class="preview-window bg-branded">
                        <!-- Branded Logo Overlay (Only shows on 'bg-branded') -->
                        <div class="preview-watermark">
                            <i class="fa-solid fa-heart-pulse text-primary text-[10px]"></i>
                            <span class="text-white text-[10px] font-bold">TeleMed Cloud</span>
                        </div>

                        <!-- Simulated User -->
                        <div class="person-silhouette">
                            <div class="person-head"></div>
                        </div>
                    </div>
                    <p class="text-xs text-muted text-center mt-1 mb-4">You are visible to the patient.</p>

                    <h3 class="text-sm font-semibold mb-2">Privacy Backgrounds</h3>
                    <div class="bg-controls">
                        <button type="button" class="bg-option-btn active" onclick="setBg(this, 'bg-branded')">
                            <span class="bg-branded bg-preview-icon"></span>
                            <span>TeleMed Branded</span>
                        </button>
                        <button type="button" class="bg-option-btn" onclick="setBg(this, 'bg-dark')">
                            <span class="bg-dark bg-preview-icon"></span>
                            <span>Background Dark</span>
                        </button>
                        <button type="button" class="bg-option-btn" onclick="setBg(this, 'bg-light')">
                            <span class="bg-light bg-preview-icon"></span>
                            <span>Background Light</span>
                        </button>
                    </div>
                </div>

                <!-- 3. Bottom Controls -->
                <div class="control-bar">
                    <button type="button" class="control-btn" aria-label="Toggle Microphone"><i
                            class="fa-solid fa-microphone"></i></button>
                    <button type="button" class="control-btn" aria-label="Toggle Camera"><i class="fa-solid fa-video"></i></button>
                    <button type="button" class="control-btn" aria-label="Share Screen"><i class="fa-solid fa-desktop"></i></button>
                    <button type="button" class="control-btn" aria-label="Chat"><i class="fa-solid fa-message"></i></button>
                    <button type="button" class="control-btn danger" onclick="window.location.href='dashboard.html'"
                        aria-label="End Call"><i class="fa-solid fa-phone-slash"></i></button>
                </div>

            </div>
        </main>
    </div>

    <!-- Auth Check -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'login.html';
            }
        })();

        // Background Switcher
        function setBg(btn, bgClass) {
            // Update Preview
            const preview = document.getElementById('selfView');
            // Remove previous bg classes
            preview.classList.remove('bg-branded', 'bg-dark', 'bg-light');
            preview.classList.add(bgClass);

            // Update Active Button
            document.querySelectorAll('.bg-option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>

</html>
