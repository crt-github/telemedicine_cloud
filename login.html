<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TeleMed Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .biometric-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .biometric-btn:hover {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--primary);
        }

        .biometric-icon {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        #mfaSection {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="hero-bg-glow"></div>

        <div class="auth-card">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>TeleMed</span>Cloud
            </div>

            <div id="errorMsg" class="auth-error-msg"></div>

            <!-- Initial Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="doctor@hospital.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" autocomplete="current-password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="auth-form-footer">
                    <label class="auth-remember-label">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="auth-forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-full">Sign In</button>
            </form>

            <!-- MFA Section (Hidden initially) -->
            <div id="mfaSection">
                <div class="divider">Two-Factor Authentication</div>
                <p class="text-sm text-muted text-center mb-4">Enter the code sent to your device or use Biometrics.</p>

                <div class="form-group">
                    <input type="text" id="mfaCode" class="form-input text-center" placeholder="XXX-XXX">
                </div>

                <button type="button" onclick="verifyMfa()" class="btn btn-primary w-full">Verify Code</button>
                <button type="button" onclick="loginVpn()" class="btn btn-outline w-full mt-2 mfa-vpn-btn"><i class="fa-solid fa-shield-vpn mr-2"></i>Connect via Secure VPN</button>
                <button type="button" onclick="bypassMfa()" class="btn btn-outline w-full mt-2 mfa-bypass-btn">Bypass for Testing</button>
                <button type="button" onclick="cancelMfa()" class="btn btn-ghost w-full mt-2">Back to Login</button>
            </div>

            <div class="divider">OR LOGIN WITH</div>

            <button type="button" class="biometric-btn" onclick="loginBiometric('face')">
                <i class="fa-solid fa-expand biometric-icon"></i>
                <span>Face ID Recognition</span>
            </button>

            <button type="button" class="biometric-btn" onclick="loginBiometric('fingerprint')">
                <i class="fa-solid fa-fingerprint biometric-icon"></i>
                <span>Touch ID / Fingerprint</span>
            </button>

            <p class="auth-signup-text">
                Don't have an account? <a href="#" class="auth-signup-link">Contact Admin</a>
            </p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const mfaSection = document.getElementById('mfaSection');
        const errorMsg = document.getElementById('errorMsg');

        let pendingToken = null; // Store token temporarily until MFA is complete

        // Handle Standard Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = loginForm.querySelector('button[type="submit"]');

            if (email && password) {
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        pendingToken = data.token;
                        loginForm.style.display = 'none';
                        mfaSection.style.display = 'block';
                        errorMsg.style.display = 'none';
                    } else {
                        showError(data.message || 'Invalid credentials');
                    }
                } catch (error) {
                    console.log('Server unreachable, checking local demo credentials...');
                    // Fallback for local file testing or server down
                    if (email === 'doctor@hospital.com' && password === 'password123') {
                        pendingToken = 'demo-token-123';
                        loginForm.style.display = 'none';
                        mfaSection.style.display = 'block';
                        showError('Note: Connected in Offline/Demo Mode (Server Unreachable)');
                        errorMsg.style.color = '#fbbf24'; // Yellow-400 for warning
                    } else {
                        showError('Network error: Server is offline and credentials do not match Demo account.');
                    }
                } finally {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } else {
                showError('Please enter email and password');
            }
        });

        // Handle MFA Verification
        function verifyMfa() {
            const code = document.getElementById('mfaCode').value;
            if (code.length >= 3 && pendingToken) {
                // Success
                localStorage.setItem('authToken', pendingToken);
                window.location.href = 'dashboard.html';
            } else {
                showError('Invalid MFA Code');
            }
        }

        // Bypass MFA (Testing Only)
        function bypassMfa() {
            if (pendingToken) {
                localStorage.setItem('authToken', pendingToken);
                window.location.href = 'dashboard.html';
            }
        }

        // Cancel MFA
        function cancelMfa() {
            pendingToken = null;
            mfaSection.style.display = 'none';
            loginForm.style.display = 'block';
            errorMsg.style.display = 'none';
            document.getElementById('mfaCode').value = '';
        }

        // Handle Biometrics
        function loginBiometric(type) {
            if (!pendingToken) {
                alert("Please complete Step 1 (Password) before using biometric verification.");
                return;
            }

            const btn = type === 'face' ? document.querySelectorAll('.biometric-btn')[0] : document.querySelectorAll('.biometric-btn')[1];
            const originalText = btn.innerHTML;

            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin biometric-icon"></i> Scanning...`;

            setTimeout(() => {
                // Success
                localStorage.setItem('authToken', pendingToken);
                window.location.href = 'dashboard.html';
            }, 1000);
        }

        // Handle VPN Choice
        function loginVpn() {
            if (!pendingToken) {
                alert("Please complete Step 1 (Password) before establishing VPN tunnel.");
                return;
            }
            
            const vpnBtn = document.querySelector('button[onclick="loginVpn()"]');
            const originalText = vpnBtn.innerHTML;
            vpnBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Establishing Tunnel...`;
            vpnBtn.disabled = true;

            setTimeout(() => {
                localStorage.setItem('authToken', pendingToken);
                window.location.href = 'dashboard.html';
            }, 1500);
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>

</html>
