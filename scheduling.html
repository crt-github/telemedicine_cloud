<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduling | TeleMed Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo mb-1">
                <i class="fa-solid fa-heart-pulse icon-secondary"></i>
                TeleMed
            </a>

            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="scheduling.html" class="active"><i class="fa-regular fa-calendar-check"></i>
                        Appointments</a></li>
                <li><a href="video-call.html"><i class="fa-solid fa-video"></i> Video Consult</a></li>
                <li><a href="medical-forms.html"><i class="fa-solid fa-file-medical"></i> Patient Records</a></li>
                <li><a href="tools.html"><i class="fa-solid fa-toolbox"></i> Tools</a></li>
                <li><a href="knowledge.html"><i class="fa-solid fa-book-medical"></i> Knowledge</a></li>
                <li><a href="ai-assistant.html"><i class="fa-solid fa-robot"></i> AI Assistant</a></li>
                <li class="mt-auto"><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i>
                        Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="mb-2">
                <h2 class="page-header-title">Appointment Management</h2>
            </div>

            <div class="scheduling-grid">
                <div class="table-container appointment-list-container">
                    <div class="flex-between-center-mb-1">
                        <h3 class="text-xl">Upcoming Appointments</h3>
                        <div class="text-xs-muted">Click card to add to calendar</div>
                    </div>

                    <div id="appointment-list">
                        <!-- Appointments injected via JS -->
                    </div>
                </div>

                <div class="quick-book-card">
                    <h3 class="mb-1">Quick Book</h3>
                    <form>
                        <div class="form-group">
                            <label class="form-label" for="patient-search">Patient Name</label>
                            <input type="text" id="patient-search" class="form-input" placeholder="Search patient...">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="appt-date">Date</label>
                            <input type="date" id="appt-date" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="appt-time">Time</label>
                            <input type="time" id="appt-time" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="appt-type">Type</label>
                            <select id="appt-type" class="form-select">
                                <option>General Check-up</option>
                                <option>Specialist Consult</option>
                                <option>Follow-up</option>
                            </select>
                        </div>
                        <button type="submit" onclick="bookAppointment()" class="btn btn-primary w-full">Book &amp;
                            Notify</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="dist/client/protect.js"></script>
    <script>
        // --- APPOINTMENT DATA ---
        const appointments = [
            {
                id: 1,
                patient: 'Sarah Johnson',
                initials: 'SJ',
                date: '2023-11-20',
                time: '09:00',
                type: 'General Check-up',
                email: 'sarah.j@example.com',
                phone: '1234567890'
            },
            {
                id: 2,
                patient: 'Michael Chen',
                initials: 'MC',
                date: '2023-11-20',
                time: '10:15',
                type: 'Follow-up',
                email: 'm.chen@example.com',
                phone: '1234567890'
            },
            {
                id: 3,
                patient: 'Emma Davis',
                initials: 'ED',
                date: '2023-11-21',
                time: '14:30',
                type: 'Specialist Consult',
                email: 'emma.d@example.com',
                phone: '1234567890'
            }
        ];

        const list = document.getElementById('appointment-list');

        // --- RENDER APPOINTMENTS ---
        appointments.forEach(appt => {
            renderAppointmentCard(appt);
        });

        function renderAppointmentCard(appt, prepend = false) {
            // Links
            const start = appt.date.replace(/-/g, '') + 'T' + appt.time.replace(':', '') + '00';
            const end = appt.date.replace(/-/g, '') + 'T' + (parseInt(appt.time.split(':')[0]) + 1).toString().padStart(2, '0') + appt.time.split(':')[1] + '00';
            const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Appointment+with+${encodeURIComponent(appt.patient)}&amp;dates=${start}/${end}&details=Telemedicine+Consultation&amp;location=Video+Room`;

            const shareText = `Join my appointment: https://telemed.cloud/room/${appt.id}`;
            const mailto = `mailto:${appt.email}?subject=Appointment&amp;body=${encodeURIComponent(shareText)}`;
            const sms = `sms:${appt.phone}?body=${encodeURIComponent(shareText)}`;
            const videoUrl = `video-call.html?room=${appt.id}`;

            const card = document.createElement('div');
            card.className = 'appointment-card';
            if (prepend) card.style.animation = 'fadeIn 0.5s ease';

            card.innerHTML = `
                <div class="appt-header">
                    <div class="appt-patient">
                        <div class="appt-avatar" style="${prepend ? 'background: var(--accent);' : ''}">${appt.initials}</div>
                        <div>
                            <div style="font-weight: 600; color: white;">${appt.patient}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">${appt.type}</div>
                        </div>
                    </div>
                </div>
                
                <div style="margin: 1rem 0; padding: 0.5rem; background: rgba(255,255,255,0.03); border-radius: 8px; display: flex; align-items: center;">
                    <div class="appt-time">
                        <i class="fa-regular fa-clock" style="margin-right: 6px; font-size: 0.9rem; color: var(--secondary);"></i>
                        ${appt.time}
                    </div>
                </div>

                <div class="share-actions" style="border-top: 1px solid var(--glass-border); padding-top: 1rem; margin-top: 0.5rem; justify-content: space-between;">
                    <div style="display: flex; gap: 0.5rem;">
                         <a href="${mailto}" class="share-btn email" title="Send Email"><i class="fa-solid fa-envelope"></i></a>
                         <a href="${sms}" class="share-btn sms" title="Send SMS"><i class="fa-solid fa-comment-sms"></i></a>
                         <!-- NEW: Video Call Icon Button -->
                         <a href="${videoUrl}" class="share-btn" style="color: var(--primary); border-color: var(--primary);" title="Join Video Call">
                            <i class="fa-solid fa-video"></i>
                         </a>
                    </div>
                    <button type="button" onclick="window.open('${gCalUrl}', '_blank')" class="btn btn-outline btn-sm" style="border: 1px solid var(--glass-border); color: white;" title="Add to Google Calendar">
                        <i class="fa-brands fa-google"></i>
                    </button>
                </div>
            `;

            if (prepend) {
                list.prepend(card);
            } else {
                list.appendChild(card);
            }
        }

        // --- QUICK BOOK LOGIC ---
        function bookAppointment() {
            const patientName = document.getElementById('patient-search').value;
            const date = document.getElementById('appt-date').value;
            const time = document.getElementById('appt-time').value;
            const type = document.getElementById('appt-type').value;

            if (!patientName || !date || !time) {
                alert("Please fill in all fields.");
                return;
            }

            const initials = patientName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);

            const newAppt = {
                id: Date.now(),
                patient: patientName,
                initials: initials,
                date: date,
                time: time,
                type: type,
                email: 'patient@example.com',
                phone: '0000000000'
            };

            renderAppointmentCard(newAppt, true);

            // Reset Form and Feedback
            document.getElementById('patient-search').value = '';
            document.getElementById('appt-time').value = '';
            alert(`Appointment booked for ${patientName} on ${date} at ${time}.`);
        }
    </script>
</body>

</html>
